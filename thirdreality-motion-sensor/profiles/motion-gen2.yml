name: motion-gen2
components:
- id: main
  capabilities:
  - id: motionSensor
    version: 1
  - id: illuminanceMeasurement
    version: 1
  - id: tamperAlert
    version: 1
  - id: appleheart46609.pirSensitivity
    version: 1
  - id: battery
    version: 1
  - id: firmwareUpdate
    version: 1
  - id: refresh
    version: 1
  categories:
  - name: MotionSensor
preferences:
  - title: "Cooldown Time (sec)"
    name: cooldownTime
    description: "Time in seconds before motion sensor returns to inactive state"
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 3600
      default: 30
  - title: "Motion LED"
    name: motionLED
    description: "Enable or disable LED feedback on motion detection"
    required: false
    preferenceType: boolean
    definition:
      default: true
